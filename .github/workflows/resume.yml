name: Generate Resume

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build LaTeX environment
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex

      - name: Rename PDF
        run: mv resume.pdf resume_narendhar.pdf

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume_narendhar
          path: resume_narendhar.pdf

  publish:
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: resume_narendhar
          path: out

      - name: Publish PDF to repository
        run: |
          cp out/resume_narendhar.pdf resume_narendhar.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resume_narendhar.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes to publish"
            exit 0
          fi
          git commit -m "publish resume_narendhar.pdf [skip ci]"
          git push
